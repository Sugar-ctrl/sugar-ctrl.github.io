    <div class="game-body">
      <div class="sidebar">
        <div class="panel"><h4>状态</h4><div class="status-text" id="jqStatus">红方布阵</div></div>
        <div class="panel"><h4>日志</h4><div class="naval-log" id="jqLog"></div></div>
        <div class="panel"><h4>规则</h4><div class="rule-text">
          5×12棋盘, 每方25枚棋子。布阵时可见, 点确定后完全隐藏(不能翻开)。双方都确定后开战: 点击己方棋子选中, 再点击相邻格子移动/攻击。攻击对方棋子直接结算: 按军衔大小吃子。<b>司令>军长>师长>旅长>团长>营长>连长>排长>工兵</b>。工兵可挖地雷, 炸弹与任何棋子同归于尽。军旗被吃则负。地雷不能移动。铁路可多步走。游戏结束后才能看到布局。
        </div></div>
        <div class="panel"><h4>功能</h4><div class="actions">
          <button class="act" id="jqConfirm">✅ 确定</button>
          <button class="act" id="jqSettle">📊 结算</button>
          <button class="act" id="jqRestart">🔄 重开</button>
        </div></div>
      </div>
      <div class="board-wrap" id="jqWrap"></div>
    </div>
  </div>`;
  const wrap=document.getElementById('jqWrap');
  const statusEl=document.getElementById('jqStatus');
  const logEl=document.getElementById('jqLog');
  function makeInitialPieces(){const arr=[];PIECE_DEFS.forEach(d=>{for(let i=0;i<d.count;i++)arr.push(d.name);});return arr;}
  function isCamp(r,c){return (r===2&&(c===0||c===4))||(r===4&&c===2)||(r===9&&(c===0||c===4))||(r===7&&c===2);}
  function isBase(r,c){return (r===5&&c===2)||(r===6&&c===2);}
  function isRailroad(r,c){return r===1||r===10;}
  function render(){
    wrap.innerHTML='';
    if(phase==='place-red'||phase==='place-blue')wrap.appendChild(renderPlacePhase(phase==='place-red'?'red':'blue'));
    else wrap.appendChild(renderBattlePhase());
    statusEl.textContent=over?('🏆 '+(winner||'结束')):
      (phase==='place-red'?'红方布阵':phase==='place-blue'?'蓝方布阵':
        (curPlayer==='red'?'红方走棋':'蓝方走棋'));
    logEl.innerHTML=log.slice(-15).map(l=>`<div>${l}</div>`).join('');
  }
  function renderPlacePhase(color){
    const div=document.createElement('div');div.className='junqi-place-wrap';
    const boardDiv=document.createElement('div');boardDiv.className='junqi-board';
    const myHalf=color==='red'?[6,11]:[0,5];
    const myReady=color==='red'?redReady:blueReady;
    const oppReady=color==='red'?blueReady:redReady;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='junqi-cell';
      if(isCamp(r,c))cell.classList.add('camp');
      else if(isBase(r,c))cell.classList.add('base');
      else if(isRailroad(r,c))cell.classList.add('railroad');
      const p=board[r][c];
      if(p){
        const isMyPiece=p.color===color;
        if((isMyPiece&&myReady)||(!isMyPiece&&oppReady)){
          cell.classList.add('unknown-'+p.color);cell.textContent='?';
        }else{
          cell.classList.add(p.color+'-piece');cell.textContent=p.name;
        }
      }else if(r>=myHalf[0]&&r<=myHalf[1]&&!myReady){
        cell.classList.add('empty');cell.style.cursor='pointer';cell.style.background='#fffbe8';
        cell.onclick=()=>placePiece(r,c,color);
      }else cell.classList.add('empty');
      boardDiv.appendChild(cell);
    }
    div.appendChild(boardDiv);
    if(!myReady){
      const pool=document.createElement('div');pool.className='junqi-piece-pool';
      const initial=makeInitialPieces();
      const counts={};initial.forEach(n=>counts[n]=(counts[n]||0)+1);
      placedPieces[color].forEach(n=>counts[n]--);
      Object.keys(counts).forEach(name=>{
        if(counts[name]<=0)return;
        const item=document.createElement('div');item.className='pool-item '+color;
        item.textContent=`${name} ×${counts[name]}`;
        item.onclick=()=>{selectedPool=name;render();};
        if(selectedPool===name)item.style.background='#fffbe8';
        pool.appendChild(item);
      });
      div.appendChild(pool);
    }
    return div;
  }
  function placePiece(r,c,color){
    if(!selectedPool)return;
    if(board[r][c])return;
    const myHalf=color==='red'?[6,11]:[0,5];
    if(r<myHalf[0]||r>myHalf[1])return;
    board[r][c]={color,name:selectedPool,revealed:true};
    placedPieces[color].push(selectedPool);
    selectedPool=null;
    render();
  }
  function renderBattlePhase(){
    const div=document.createElement('div');div.style.display='flex';div.style.flexDirection='column';div.style.alignItems='center';
    const boardDiv=document.createElement('div');boardDiv.className='junqi-board';
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='junqi-cell';
      if(isCamp(r,c))cell.classList.add('camp');
      else if(isBase(r,c))cell.classList.add('base');
      else if(isRailroad(r,c))cell.classList.add('railroad');
      const p=board[r][c];
      if(p){
        if(over){cell.classList.add(p.color+'-piece');cell.textContent=p.name;}
        else{cell.classList.add('unknown-'+p.color);cell.textContent='?';}
      }else cell.classList.add('empty');
      if(selected&&selected[0]===r&&selected[1]===c)cell.classList.add('selected');
      if(selected){const[sr,sc]=selected;if(canMove(sr,sc,r,c))cell.classList.add('movable-hint');}
      cell.onclick=()=>clickBattle(r,c);
      boardDiv.appendChild(cell);
    }
    div.appendChild(boardDiv);
    return div;
  }
  function clickBattle(r,c){
    if(over||phase!=='battle')return;
    const p=board[r][c];
    if(selected){
      const[sr,sc]=selected;
      const from=board[sr][sc];
      if(canMove(sr,sc,r,c)){
        const target=board[r][c];
        let text=`${from.color==='red'?'🔴 红方':'🔵 蓝方'} (${sr+1},${sc+1})→(${r+1},${c+1})`;
        if(target){
          const result=judge(from,target);
          if(result==='win'){
            text += ` 吃 ${target.color==='red'?'🔴 红方':'🔵 蓝方'} ${target.name}`;
            board[r][c]=from;board[sr][sc]=null;
            if(target.name==='军旗'){over=true;winner=(from.color==='red'?'红方':'蓝方')+'获胜(夺旗)';log.push(text);log.push('🏆 '+winner);render();return;}
          }else if(result==='lose'){
            text += ` 被 ${target.color==='red'?'🔴 红方':'🔵 蓝方'} ${target.name} 吃掉`;
            board[sr][sc]=null;
          }else{
            text += ` 与 ${target.color==='red'?'🔴 红方':'🔵 蓝方'} ${target.name} 同归于尽`;
            board[r][c]=null;board[sr][sc]=null;
          }
        }else{board[r][c]=from;board[sr][sc]=null;}
        log.push(text);
        selected=null;
        if(!over)switchTurn();
        render();return;
      }
      selected=null;render();return;
    }
    if(p&&p.color===curPlayer){selected=[r,c];render();return;}
  }
  function canMove(sr,sc,tr,tc){
    if(sr===tr&&sc===tc)return false;
    const p=board[sr][sc];if(!p)return false;
    if(p.name==='地雷'||p.name==='军旗')return false;
    const target=board[tr][tc];
    if(target&&target.color===p.color)return false;
    const dr=tr-sr,dc=tc-sc;
    if(isRailroad(sr,sc)&&isRailroad(tr,tc)){
      if(dr===0){const step=Math.sign(dc);for(let c=sc+step;c!==tc;c+=step)if(board[sr][c])return false;return true;}
      if(dc===0){const step=Math.sign(dr);for(let r=sr+step;r!==tr;r+=step)if(board[r][sc])return false;return true;}
    }
    if(Math.abs(dr)+Math.abs(dc)===1)return true;
    return false;
  }
  function judge(attacker,defender){
    if(attacker.name==='炸弹'||defender.name==='炸弹')return 'draw';
    if(defender.name==='地雷'){if(attacker.name==='工兵')return 'win';return 'draw';}
    if(defender.name==='军旗')return 'win';
    const ar=getRank(attacker.name),dr=getRank(defender.name);
    if(ar>dr)return 'win';
    if(ar<dr)return 'lose';
    return 'draw';
  }
  function getRank(name){const d=PIECE_DEFS.find(x=>x.name===name);return d?d.rank:-999;}
  function switchTurn(){
    curPlayer=curPlayer==='red'?'blue':'red';
    let redFlag=false,blueFlag=false;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=board[r][c];
      if(p&&p.name==='军旗'){if(p.color==='red')redFlag=true;else blueFlag=true;}
    }
    if(!redFlag&&!blueFlag){over=true;winner='平局(双方军旗均已失)';log.push('🏆 '+winner);}
    else if(!redFlag){over=true;winner='蓝方获胜(夺旗)';log.push('🏆 '+winner);}
    else if(!blueFlag){over=true;winner='红方获胜(夺旗)';log.push('🏆 '+winner);}
  }
  document.getElementById('jqConfirm').onclick=()=>{
    if(phase==='place-red'){
      if(placedPieces.red.length<25){alert(`红方还有${25-placedPieces.red.length}枚棋子未放置!`);return;}
      redReady=true;phase='place-blue';selectedPool=null;
      log.push('红方布阵完成并隐藏, 轮到蓝方');render();
    }else if(phase==='place-blue'){
      if(placedPieces.blue.length<25){alert(`蓝方还有${25-placedPieces.blue.length}枚棋子未放置!`);return;}
      blueReady=true;phase='battle';curPlayer='red';selectedPool=null;
      log.push('双方布阵完成, 开始对战! 红方先手');render();
    }
  };
  document.getElementById('jqSettle').onclick=()=>{
    if(over)return;over=true;
    let redCount=0,blueCount=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=board[r][c];
      if(p){if(p.color==='red')redCount++;else blueCount++;}
    }
    if(redCount>blueCount)winner=`红方获胜(红${redCount} vs 蓝${blueCount})`;
    else if(blueCount>redCount)winner=`蓝方获胜(红${redCount} vs 蓝${blueCount})`;
    else winner=`平局(双方各${redCount})`;
    log.push('📊 '+winner);render();
  };
  document.getElementById('jqRestart').onclick=()=>{
    board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    phase='place-red';placedPieces={red:[],blue:[]};selectedPool=null;
    curPlayer='red';over=false;winner=null;selected=null;log=[];
    redReady=false;blueReady=false;
    render();
  };
  currentGameStateGetter=()=>({game:'junqi',board,phase,placedPieces,curPlayer,over,winner,log,redReady,blueReady});
  currentGameStateSetter=(s)=>{
    board=s.board;phase=s.phase;placedPieces=s.placedPieces;curPlayer=s.curPlayer;
    over=s.over;winner=s.winner;log=s.log||[];redReady=s.redReady;blueReady=s.blueReady;
    selectedPool=null;selected=null;render();
  };
  render();
}

/* ⑬ 双陆棋 */
function initBackgammon(container){
  let points=Array.from({length:24},()=>[]);
  points[23]=Array(5).fill('white');
  points[18]=Array(3).fill('white');
  points[12]=Array(5).fill('white');
  points[1]=Array(2).fill('white');
  points[0]=Array(5).fill('black');
  points[5]=Array(3).fill('black');
  points[16]=Array(5).fill('black');
  points[11]=Array(2).fill('black');
  let whiteOut=0, blackOut=0;
  let cur='white',over=false,winner=null;
  let dice=[],usedDice=[];
  let phase='roll';
  let selectedPoint=null;
  let log=[];
  container.innerHTML=`
  <div class="game-page active">
    <div class="game-head"><div class="game-title">🎲 双陆棋 · 西洋双陆</div></div>
    <div class="game-body">
      <div class="sidebar">
        <div class="panel"><h4>规则</h4><div class="rule-text">
          白先黑后。掷两枚骰子, 按点数移动棋子。<br>
          白方从23往0方向移动, 黑方从0往23方向移动。<br>
          目标: 将全部15枚棋子移出棋盘。若点数被对方单子占住, 则不能停在该点。
        </div></div>
        <div class="panel"><h4>状态</h4><div class="status-text" id="bgStatus">⚪ 白方掷骰</div></div>
        <div class="panel"><h4>棋盘信息</h4><div class="backgammon-info" id="bgInfo">白出: 0 / 黑出: 0</div></div>
        <div class="panel"><h4>日志</h4><div class="naval-log" id="bgLog"></div></div>
        <div class="panel"><h4>功能</h4><div class="actions">
          <button class="act" id="bgResign">🏳️ 投降</button>
          <button class="act" id="bgSettle">📊 结算</button>
          <button class="act" id="bgRestart">🔄 重开</button>
        </div></div>
      </div>
      <div class="board-wrap" id="bgWrap"></div>
    </div>
  </div>`;
  const wrap=document.getElementById('bgWrap'),statusEl=document.getElementById('bgStatus'),infoEl=document.getElementById('bgInfo');
  function render(){
    wrap.innerHTML='';
    const d=document.createElement('div');d.className='backgammon-board';
    const half1=document.createElement('div');half1.className='backgammon-half';
    const half2=document.createElement('div');half2.className='backgammon-half';
    function makePoint(idx,isBottom){
      const p=document.createElement('div');
      p.className='backgammon-point '+(idx%2===0?'dark-tri':'light-tri')+(isBottom?' bottom':'');
      p.dataset.idx=idx;
      if(selectedPoint===idx)p.classList.add('highlight');
      const arr=points[idx];
      const maxShow=5;
      arr.slice(0,maxShow).forEach(color=>{
        const c=document.createElement('div');c.className='checker '+color;
        c.textContent=color==='white'?'○':'●';
        p.appendChild(c);
      });
      if(arr.length>maxShow){
        const more=document.createElement('div');more.style.fontSize='.7rem';more.textContent='+'+(arr.length-maxShow);p.appendChild(more);
      }
      p.onclick=()=>clickPoint(idx);
      return p;
    }
    for(let i=0;i<6;i++)half1.appendChild(makePoint(12+i,false));
    for(let i=0;i<6;i++)half1.appendChild(makePoint(6+i,true));
    for(let i=0;i<6;i++)half2.appendChild(makePoint(18+i,false));
    for(let i=0;i<6;i++)half2.appendChild(makePoint(0+i,true));
    d.appendChild(half1);
    const bar=document.createElement('div');bar.className='backgammon-bar';
    for(let i=0;i<Math.min(3,whiteOut);i++){const c=document.createElement('div');c.className='checker white';bar.appendChild(c);}
    for(let i=0;i<Math.min(3,blackOut);i++){const c=document.createElement('div');c.className='checker black';bar.appendChild(c);}
    d.appendChild(bar);
    d.appendChild(half2);
    wrap.appendChild(d);
    const diceArea=document.createElement('div');diceArea.className='backgammon-dice';
    dice.forEach((v,i)=>{
      const die=document.createElement('div');die.className='backgammon-die'+(usedDice.includes(i)?' used':'');
      const symbols=['','⚀','⚁','⚂','⚃','⚄','⚅'];
      die.textContent=symbols[v];
      if(!usedDice.includes(i)&&phase==='move')die.onclick=()=>useDie(i);
      diceArea.appendChild(die);
    });
    wrap.appendChild(diceArea);
    if(phase==='roll'&&!over){
      const rollBtn=document.createElement('button');rollBtn.className='btn primary';rollBtn.textContent='🎲 掷骰子';
      rollBtn.style.marginTop='12px';
      rollBtn.onclick=rollDice;
      wrap.appendChild(rollBtn);
    }
    statusEl.textContent=over?('🏆 '+(winner||'结束')):(cur==='white'?'⚪ 白方':'⚫ 黑方')+(phase==='roll'?' 掷骰':' 走棋');
    infoEl.textContent=`白出: ${whiteOut}/15 · 黑出: ${blackOut}/15`;
    renderLog('bgLog',log);
  }
  function rollDice(){
    if(over||phase!=='roll')return;
    const d1=Math.floor(Math.random()*6)+1;
    const d2=Math.floor(Math.random()*6)+1;
    dice=[d1,d2];
    usedDice=[];
    phase='move';
    log.push(`🎲 ${cur==='white'?'⚪ 白方':'⚫ 黑方'} 掷出 ${d1}, ${d2}`);
    render();
  }
  function useDie(i){
    if(phase!=='move'||over)return;
    const steps=dice[i];
    if(selectedPoint!==null){
      if(!moveFrom(selectedPoint,steps)){
        selectedPoint=null;
        usedDice.push(i);
        render();
        return;
      }
      usedDice.push(i);
      selectedPoint=null;
      if(usedDice.length>=dice.length) nextTurn();
      render();
    }else{
      alert('请先点击要移动的棋子');
    }
  }
  function clickPoint(idx){
    if(over||phase!=='move')return;
    const arr=points[idx];
    if(selectedPoint===null){
      if(arr.length>0&&arr[0]===cur){
        selectedPoint=idx;
        render();
      }
    }else{
      const unusedIdx=dice.map((v,i)=>usedDice.includes(i)?-1:i).filter(i=>i>=0);
      if(unusedIdx.length===0){selectedPoint=null;render();return;}
      let moved=false;
      for(const ui of unusedIdx){
        const steps=dice[ui];
        if(moveFrom(selectedPoint,steps)){
          usedDice.push(ui);
          moved=true;
          break;
        }
      }
      if(moved){
        selectedPoint=null;
        if(usedDice.length>=dice.length)nextTurn();
      }else{
        if(arr.length>0&&arr[0]===cur)selectedPoint=idx;
        else selectedPoint=null;
      }
      render();
    }
  }
  function moveFrom(from,steps){
    const dir=cur==='white'?-1:1;
    const target=from+dir*steps;
    if(cur==='white'&&target<0){
      let allHome=true;
      for(let i=6;i<24;i++)if(points[i].some(c=>c==='white'))allHome=false;
      if(!allHome)return false;
      points[from].pop();
      whiteOut++;
      log.push(`⚪ 白方 ${from+1}→出棋`);
      if(whiteOut>=15){over=true;winner='白方获胜';log.push('🏆 '+winner);}
      return true;
    }
    if(cur==='black'&&target>23){
      let allHome=true;
      for(let i=0;i<18;i++)if(points[i].some(c=>c==='black'))allHome=false;
      if(!allHome)return false;
      points[from].pop();
      blackOut++;
      log.push(`⚫ 黑方 ${from+1}→出棋`);
      if(blackOut>=15){over=true;winner='黑方获胜';log.push('🏆 '+winner);}
      return true;
    }
    if(target<0||target>23)return false;
    const t=points[target];
    if(t.length>0&&t[0]!==cur){
      if(t.length>=2)return false;
      t.pop();
      log.push(`${cur==='white'?'⚪ 白方':'⚫ 黑方'} ${from+1}→${target+1} 吃子`);
    } else {
      log.push(`${cur==='white'?'⚪ 白方':'⚫ 黑方'} ${from+1}→${target+1}`);
    }
    points[from].pop();
    points[target].push(cur);
    return true;
  }
  function nextTurn(){
    cur=cur==='white'?'black':'white';
    dice=[];
    usedDice=[];
    phase='roll';
    selectedPoint=null;
  }
  document.getElementById('bgResign').onclick=()=>{if(over)return;over=true;winner=cur==='white'?'黑方胜(白投降)':'白方胜(黑投降)';log.push('🏳️ '+winner);render();};
  document.getElementById('bgSettle').onclick=()=>{
    if(over)return;
    over=true;
    if(whiteOut>blackOut)winner=`白方获胜(白出${whiteOut} vs 黑出${blackOut})`;
    else if(blackOut>whiteOut)winner=`黑方获胜(白出${whiteOut} vs 黑出${blackOut})`;
    else winner=`平局(白出${whiteOut} 黑出${blackOut})`;
    log.push('📊 '+winner);render();
  };
  document.getElementById('bgRestart').onclick=()=>{
    points=Array.from({length:24},()=>[]);
    points[23]=Array(5).fill('white');
    points[18]=Array(3).fill('white');
    points[12]=Array(5).fill('white');
    points[1]=Array(2).fill('white');
    points[0]=Array(5).fill('black');
    points[5]=Array(3).fill('black');
    points[16]=Array(5).fill('black');
    points[11]=Array(2).fill('black');
    whiteOut=0;blackOut=0;
    cur='white';over=false;winner=null;dice=[];usedDice=[];phase='roll';selectedPoint=null;log=[];
    render();
  };
  currentGameStateGetter=()=>({game:'backgammon',points,whiteOut,blackOut,cur,over,winner,dice,usedDice,phase,log});
  currentGameStateSetter=(s)=>{
    points=s.points;whiteOut=s.whiteOut;blackOut=s.blackOut;cur=s.cur;over=s.over;winner=s.winner;
    dice=s.dice||[];usedDice=s.usedDice||[];phase=s.phase;log=s.log||[];selectedPoint=null;render();
  };
  render();
}

/* ⑭ 大富翁（5.5 新版逻辑） */
function initMonopoly(container){
  const PORTALS = [0, 60];
  const JAILS = [14];
  const HOSPITALS = [42];
  const BANKS = [28, 68];
  const CHANCES = [5, 9, 19, 23, 33, 37, 47, 51, 64, 72];

  let totalPlayers = 2;
  let players = [];
  let curPlayer = 0;
  let over = false;
  let winner = null;
  let log = [];
  let round = 1;
  let turnCount = 0;
  let bankOpen = false;
  let properties = [];

  function initGame() {
    players = [];
    for (let i = 0; i < totalPlayers; i++) {
      players.push({
        id: i, name: '玩家' + (i + 1),
        color: ['#e74c3c', '#3498db', '#27ae60', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#34495e', '#e84393', '#8B4513'][i],
        money: 1000, bank: 0, pos: Math.floor(Math.random() * 80),
        jailTurns: 0, hospitalTurns: 0, skipTurns: 0,
        discount: false, bankrupt: false
      });
    }
    players.forEach(p => {
      while ([0, 14, 28, 42, 60, 68, 56, 57, 58, 59, 76, 77, 78, 79].includes(p.pos)) {
        p.pos = Math.floor(Math.random() * 80);
      }
    });
    curPlayer = 0; over = false; winner = null; log = []; round = 1; turnCount = 0; bankOpen = false;
    properties = Array.from({ length: 80 }, () => ({ owner: null, level: 0, rent: 0 }));
  }

  function getCellPos(i) {
    const W = 100 / 15;
    const INNER_W = 60 / 5;
    if (i < 60) {
      if (i < 15) { return { left: i * W, top: 0, w: W, h: W }; }
      else if (i < 29) { return { left: 100 - W, top: (i - 14) * W, w: W, h: W }; }
      else if (i < 43) { return { left: 100 - W - (i - 28) * W, top: 100 - W, w: W, h: W }; }
      else { return { left: 0, top: 100 - W - (i - 42) * W, w: W, h: W }; }
    } else {
      const j = i - 60;
      if (j === 0) return { left: 20, top: 20, w: INNER_W, h: INNER_W };
      else if (j < 5) return { left: 20 + j * INNER_W, top: 20, w: INNER_W, h: INNER_W };
      else if (j === 5) return { left: 80 - INNER_W, top: 20 + INNER_W, w: INNER_W, h: INNER_W };
      else if (j < 9) return { left: 80 - INNER_W, top: 20 + (j - 4) * INNER_W, w: INNER_W, h: INNER_W };
      else if (j === 9) return { left: 80 - 2 * INNER_W, top: 80 - INNER_W, w: INNER_W, h: INNER_W };
      else if (j < 13) return { left: Math.max(20, 80 - INNER_W - (j - 8) * INNER_W), top: 80 - INNER_W, w: INNER_W, h: INNER_W };
      else if (j === 13) return { left: 20, top: 80 - 2 * INNER_W, w: INNER_W, h: INNER_W };
      else return { left: 20, top: Math.max(20, 80 - INNER_W - (j - 12) * INNER_W), w: INNER_W, h: INNER_W };
    }
  }

  function rentOf(prop) {
    if (!prop || prop.owner === null || prop.rent === 0) return 0;
    let mult = 1;
    if (round >= 6) mult = Math.pow(2, round - 5);
    return prop.rent * mult;
  }

  container.innerHTML = `
  <div class="game-page active">
    <div class="game-head"><div class="game-title">🏠 大富翁 · 外56格 + 内16格 · 传送门</div></div>
    <div class="game-body">
      <div class="sidebar">
        <div class="panel"><h4>设置人数 (2-10人)</h4><div class="mono-setup" id="monoSetup"></div></div>
        <div class="panel"><h4>规则</h4><div class="rule-text">
          每人开局 1000 元，资金 ≤ 0 时强制卖出所有房产并取出存款，总额 ≥ 1000 复活，否则淘汰。<br>
          空地购买 100，别人踩上付 10。<br>
          升级一次 200，租金 20；升级两次 500，租金 50。<br>
          从第 6 轮开始，租金每过 1 轮翻一倍。<br>
          所有玩家各走完一次 = 1 轮。<br>
          银行第 1 轮不开，之后每轮开放；开放时存款产生 20% 利息（<b>利息直接加到资金里，存款不变</b>）。<br>
          踩到银行格存 20% 资金。<br>
          进监狱/医院/抽中跳过，会强制跳过下个回合。<br>
          掷出 6 或 12 可再投一次。<br>
          经过起点获 200 元。外圈 0 传内圈 60，内圈 60 传外圈 0。<br>
          <b>新增：</b>机会有概率抽中“百万英镑”，直接存入银行存款。<br>
          <b>斩杀线：</b>当资金 ≤ 0 时，会先扣除 1000 斩杀线，如果卖完所有资产仍不够复活，直接破产。
        </div></div>
        <div class="panel"><h4>状态</h4><div class="status-text" id="monoStatus">玩家1 掷骰</div></div>
        <div class="panel"><h4>日志</h4><div class="naval-log" id="monoLog"></div></div>
        <div class="panel"><h4>功能</h4><div class="actions">
          <button class="act" id="monoResign">🏳️ 投降</button>
          <button class="act" id="monoSettle">📊 结算</button>
          <button class="act" id="monoRestart">🔄 重开</button>
        </div></div>
      </div>
      <div class="board-wrap" id="monoWrap"></div>
    </div>
  </div>`;

  const wrap = document.getElementById('monoWrap');
  const statusEl = document.getElementById('monoStatus');
  const logEl = document.getElementById('monoLog');
  const setupBox = document.getElementById('monoSetup');
  const tooltip = document.getElementById('cellTooltip');

  function render() {
    wrap.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'monopoly-wrap';
    const board = document.createElement('div');
    board.className = 'mono-board';

    for (let i = 0; i < 80; i++) {
      const pos = getCellPos(i);
      const cellDiv = document.createElement('div');
      cellDiv.className = 'mono-cell';
      cellDiv.style.left = pos.left + '%';
      cellDiv.style.top = pos.top + '%';
      cellDiv.style.width = pos.w + '%';
      cellDiv.style.height = pos.h + '%';

      const numDiv = document.createElement('div');
      numDiv.className = 'cell-num';
      numDiv.textContent = i;
      cellDiv.appendChild(numDiv);

      if (PORTALS.includes(i)) {
        cellDiv.classList.add('portal');
        cellDiv.innerHTML += '<div class="name">传送门</div>';
        cellDiv.style.zIndex = '15';
      } else if (JAILS.includes(i)) {
        cellDiv.classList.add('jail');
        cellDiv.innerHTML += '<div class="name">监狱</div>';
      } else if (HOSPITALS.includes(i)) {
        cellDiv.classList.add('hospital');
        cellDiv.innerHTML += '<div class="name">医院</div>';
      } else if (BANKS.includes(i)) {
        cellDiv.classList.add('bank');
        cellDiv.innerHTML += '<div class="name">银行</div>';
      } else if (CHANCES.includes(i)) {
        cellDiv.classList.add('chance');
        cellDiv.innerHTML += '<div class="name">机会</div>';
      } else {
        cellDiv.innerHTML += '<div class="name">空地</div><div class="price">$100</div>';
        const prop = properties[i];
        if (prop.owner !== null) {
          const bar = document.createElement('div');
          bar.className = 'mono-owner-bar';
          bar.style.background = players[prop.owner].color;
          cellDiv.appendChild(bar);
          const house = document.createElement('div');
          house.className = 'mono-house';
          if (prop.level === 1) house.textContent = '🏠';
          else if (prop.level === 2) house.textContent = '🏡';
          else if (prop.level === 3) house.textContent = '🏢';
          cellDiv.appendChild(house);
        }
      }

      cellDiv.onmouseenter = (e) => {
        let info = `<strong>[${i}] 号格</strong><br>`;
        if (PORTALS.includes(i)) info += "功能：传送门<br>暂无信息";
        else if (JAILS.includes(i)) info += "功能：监狱<br>暂无信息";
        else if (HOSPITALS.includes(i)) info += "功能：医院<br>暂无信息";
        else if (BANKS.includes(i)) info += "功能：银行<br>暂无信息";
        else if (CHANCES.includes(i)) info += "功能：机会<br>暂无信息";
        else {
          const prop = properties[i];
          if (prop.owner === null) info += "空地<br>暂无信息";
          else {
            const ownerName = players[prop.owner].name;
            const basePrice = prop.level === 1 ? 100 : (prop.level === 2 ? 300 : 800);
            const currentRent = rentOf(prop);
            info += `所有者：<span style="color:${players[prop.owner].color}">${ownerName}</span><br>`;
            info += `价值：$${basePrice}<br>当前租金：$${currentRent}`;
          }
        }
        tooltip.innerHTML = info;
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
      };
      cellDiv.onmouseleave = () => { tooltip.style.display = 'none'; };

      board.appendChild(cellDiv);
    }

    players.forEach(p => {
      if (p.bankrupt) return;
      const pos = getCellPos(p.pos);
      const centerLeft = pos.left + pos.w / 2;
      const centerTop = pos.top + pos.h / 2;
      const piece = document.createElement('div');
      piece.className = 'mono-piece';
      piece.style.background = p.color;
      piece.style.left = centerLeft + '%';
      piece.style.top = centerTop + '%';
      piece.style.transform = 'translate(-50%, -50%)';
      piece.style.marginLeft = (p.id * 4 - (totalPlayers - 1) * 2) + 'px';
      board.appendChild(piece);
    });

    d.appendChild(board);

    const panel = document.createElement('div');
    panel.className = 'mono-panel';
    players.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'mono-player-card' + (i === curPlayer && !over && !p.bankrupt ? ' active' : '') + (p.bankrupt ? ' bankrupt' : '');
      let status = '';
      if (p.jailTurns > 0) status = ' (🚔监狱)';
      else if (p.hospitalTurns > 0) status = ' (🏥医院)';
      else if (p.skipTurns > 0) status = ' (💤跳过)';
      let html = `<div style="color:${p.color}">${p.name}${status}${p.bankrupt ? ' 💀' : ''}</div>`;
      if (p.bankrupt) html += `<div class="mono-bankrupt-label">破产</div>`;
      else {
        html += `<div class="mono-money">$${p.money}</div>`;
        if (p.bank > 0) html += `<div class="mono-bank">($${p.bank})</div>`;
      }
      card.innerHTML = html;
      panel.appendChild(card);
    });
    d.appendChild(panel);

    if (!over) {
      const rollBtn = document.createElement('button');
      rollBtn.className = 'btn primary';
      const p = players[curPlayer];
      let btnText = `🎲 ${p.name} 掷骰子 (第${round}轮${bankOpen ? ' · 银行开' : ' · 银行关'})`;
      if (p.jailTurns > 0) btnText = `🚔 ${p.name} 在监狱中 (点击消耗回合)`;
      if (p.hospitalTurns > 0) btnText = `🏥 ${p.name} 在医院中 (点击消耗回合)`;
      if (p.skipTurns > 0) btnText = `💤 ${p.name} 被跳过 (点击消耗回合)`;
      rollBtn.textContent = btnText;
      rollBtn.style.marginTop = '12px';
      rollBtn.onclick = rollDice;
      if (p.bankrupt) rollBtn.disabled = true;
      d.appendChild(rollBtn);
    }

    wrap.appendChild(d);

    const p = players[curPlayer];
    let statusText = `${p.name} 的回合 · 第 ${round} 轮`;
    if (p.jailTurns > 0) statusText += ` (🚔监狱剩余${p.jailTurns}轮)`;
    if (p.hospitalTurns > 0) statusText += ` (🏥医院剩余${p.hospitalTurns}轮)`;
    if (p.skipTurns > 0) statusText += ` (💤跳过剩余${p.skipTurns}轮)`;
    statusEl.textContent = over ? ('🏆 ' + (winner || '结束')) : statusText;
    logEl.innerHTML = log.slice(-15).map(l => `<div>${l}</div>`).join('');
    logEl.scrollTop = logEl.scrollHeight;

    buildSetup();
  }

  function buildSetup() {
    if (!setupBox) return;
    setupBox.innerHTML = '';
    for (let i = 2; i <= 10; i++) {
      const b = document.createElement('button');
      b.className = 'act';
      b.textContent = i + '人';
      if (totalPlayers === i) b.style.background = '#e8dcc0';
      b.onclick = () => {
        totalPlayers = i;
        initGame();
        render();
      };
      setupBox.appendChild(b);
    }
  }

  function nextTurn() {
    let next = (curPlayer + 1) % players.length;
    let guard = 0;
    while ((players[next].bankrupt || players[next].money <= 0) && guard < players.length) {
      next = (next + 1) % players.length;
      guard++;
    }
    curPlayer = next;
    turnCount++;
    const aliveCount = players.filter(p => !p.bankrupt).length;
    if (turnCount >= aliveCount) {
      turnCount = 0;
      round++;
      bankOpen = (round > 1);
      if (bankOpen) {
        players.forEach(p => {
          if (!p.bankrupt && p.bank > 0) {
            const interest = Math.floor(p.bank * 0.2);
            p.money += interest; // 利息加到手头资金，存款不变
            log.push(`🏦 ${p.name} 存款利息 +$${interest}（加到资金，银行开放）`);
          }
        });
      }
      log.push(`📅 进入第 ${round} 轮，银行${bankOpen ? '开放' : '关闭'}`);
    }
  }

  function rollDice() {
    if (over) return;
    const p = players[curPlayer];
    if (p.bankrupt) return;

    if (p.jailTurns > 0) {
      p.jailTurns--;
      if (p.jailTurns > 0) log.push(`🚔 ${p.name} 在监狱中，消耗回合并跳过（剩余 ${p.jailTurns} 轮）`);
      else log.push(`🚔 ${p.name} 刑满释放，下回合正常行动`);
      nextTurn(); render(); return;
    }
    if (p.hospitalTurns > 0) {
      p.hospitalTurns--;
      if (p.hospitalTurns > 0) log.push(`🏥 ${p.name} 在医院中，消耗回合并跳过（剩余 ${p.hospitalTurns} 轮）`);
      else log.push(`🏥 ${p.name} 康复出院，下回合正常行动`);
      nextTurn(); render(); return;
    }
    if (p.skipTurns > 0) {
      p.skipTurns--;
      if (p.skipTurns > 0) log.push(`💤 ${p.name} 被罚跳过，消耗回合并跳过（剩余 ${p.skipTurns} 轮）`);
      else log.push(`💤 ${p.name} 跳过结束，下回合正常行动`);
      nextTurn(); render(); return;
    }

    const d1 = Math.floor(Math.random() * 6) + 1;
    const d2 = Math.floor(Math.random() * 6) + 1;
    const steps = d1 + d2;
    const oldPos = p.pos;
    log.push(`🎲 ${p.name} 掷出 ${d1}+${d2}=${steps}`);

    let newPos = oldPos;
    let crossedStart = false;
    if (oldPos < 60) {
      let current = oldPos;
      for (let i = 0; i < steps; i++) {
        current++;
        if (current > 55) { current = 0; crossedStart = true; }
      }
      newPos = current;
    } else {
      let current = oldPos;
      for (let i = 0; i < steps; i++) {
        current++;
        if (current > 75) { current = 60; crossedStart = true; }
      }
      newPos = current;
    }

    if (crossedStart) {
      p.money += 200;
      log.push(`💰 ${p.name} 经过起点，获得 $200`);
    }

    if (newPos === 0) {
      newPos = 60;
      log.push(`🌀 ${p.name} 落在传送门 [0号格]，切换到内圈 [60号格]`);
    } else if (newPos === 60) {
      newPos = 0;
      log.push(`🌀 ${p.name} 落在传送门 [60号格]，切换到外圈 [0号格]`);
    }

    log.push(`🚶 ${p.name} 从 [${oldPos}号格] 移动到 [${newPos}号格]`);
    p.pos = newPos;
    render();

    setTimeout(() => handleCell(p, () => {
      if (p.bankrupt) {
        nextTurn();
        render();
        return;
      }
      if (d1 === 6 || steps === 12) {
        log.push(`🎉 ${p.name} 掷出 ${steps === 12 ? '双六' : '6点'}，再投一次！`);
        render();
      } else {
        nextTurn();
        render();
      }
    }), 300);
  }

  function handleCell(p, callback) {
    const pos = p.pos;
    if (PORTALS.includes(pos)) { if (!over) callback(); return; }
    if (JAILS.includes(pos)) {
      p.jailTurns = 1; log.push(`🚔 ${p.name} 进了监狱1轮`);
      render(); if (!over) callback(); return;
    }
    if (HOSPITALS.includes(pos)) {
      p.hospitalTurns = 1; log.push(`🏥 ${p.name} 进了医院1轮`);
      render(); if (!over) callback(); return;
    }
    if (BANKS.includes(pos)) {
      const deposit = Math.floor(p.money * 0.2);
      p.money -= deposit; p.bank += deposit;
      log.push(`🏦 ${p.name} 在银行存入 $${deposit}，当前存款 $${p.bank}`);
      render(); if (!over) callback(); return;
    }
    if (CHANCES.includes(pos)) {
      const card = Math.floor(Math.random() * 7);
      if (card === 0) { p.pos = 14; p.jailTurns = 2; log.push(`🚔 抽到卡：进监狱2轮 (移动到 14号格)`); }
      else if (card === 1) { p.pos = 42; p.hospitalTurns = 2; log.push(`🏥 抽到卡：进医院2轮 (移动到 42号格)`); }
      else if (card === 2) { p.discount = true; log.push(`🎟️ 抽到卡：下次买楼半价`); }
      else if (card === 3) { p.money += 100; log.push(`💰 抽到卡：获得 $100`); }
      else if (card === 4) { p.money -= 50; log.push(`💸 抽到卡：扣除 $50`); }
      else if (card === 5) { p.skipTurns = 1; log.push(`💤 抽到卡：跳过一轮`); }
      else { p.bank += 1000000; log.push(`💷 抽到卡：百万英镑！银行存款增加 $1,000,000！`); }
      render(); if (!over) callback(); return;
    }

    const prop = properties[pos];
    if (prop.owner === null) {
      let buyPrice = 100;
      if (p.discount) { buyPrice = 50; p.discount = false; log.push('🎟️ 使用低价买楼权！'); }
      if (p.money >= buyPrice) {
        prop.owner = p.id; prop.level = 1; prop.rent = 10; p.money -= buyPrice;
        log.push(`✅ ${p.name} 购买了地皮，花费 $${buyPrice}`);
      } else {
        log.push(`❌ ${p.name} 资金不足，无法购买`);
      }
    } else if (prop.owner !== p.id) {
      const rent = rentOf(prop);
      p.money -= rent;
      players[prop.owner].money += rent;
      log.push(`💸 ${p.name} 向 ${players[prop.owner].name} 支付租金 $${rent}（第${round}轮，翻倍×${round >= 6 ? Math.pow(2, round - 5) : 1}）`);
    } else {
      if (prop.level === 1 && p.money >= 200) {
        prop.level = 2; prop.rent = 20; p.money -= 200;
        log.push(`⬆️ ${p.name} 升级到 🏡 2级，花费 $200`);
      } else if (prop.level === 2 && p.money >= 500) {
        prop.level = 3; prop.rent = 50; p.money -= 500;
        log.push(`⬆️ ${p.name} 升级到 🏢 3级，花费 $500`);
      } else {
        log.push(`🏠 ${p.name} 停留在自己的地产上`);
      }
    }

    if (p.money <= 0) {
      log.push(`💀 ${p.name} 资金见底，开始变卖所有房产并取出存款...`);
      let totalCash = 0;
      properties.forEach((c, idx) => {
        if (c.owner === p.id) {
          let val = 100;
          if (c.level === 2) val = 300;
          else if (c.level === 3) val = 800;
          totalCash += val;
          log.push(`🏠 卖出 (${idx + 1}号格) 房产，回收 $${val}`);
          c.owner = null; c.level = 0; c.rent = 0;
        }
      });
      if (p.bank > 0) {
        log.push(`🏦 取出存款 $${p.bank}`);
        totalCash += p.bank; p.bank = 0;
      }
      p.money = totalCash;
      log.push(`💰 ${p.name} 变卖后共有 $${totalCash}，扣除 1000 斩杀线...`);
      if (p.money >= 1000) {
        p.money -= 1000;
        log.push(`✨ ${p.name} 资产达标，扣除 1000 斩杀线后余 $${p.money}，成功复活！`);
      } else {
        p.bankrupt = true;
        p.money = 0;
        log.push(`💀 ${p.name} 资产不足 $1000，无法跨过斩杀线，宣告破产淘汰`);
      }
    }

    checkWin();
    render();
    if (!over) callback();
  }

  function checkWin() {
    const alive = players.filter(p => !p.bankrupt && p.money > 0);
    if (alive.length <= 1) {
      over = true;
      winner = alive.length === 1 ? alive[0].name + ' 获胜' : '平局';
      log.push(`🏆 ${winner}`);
    }
  }

  document.getElementById('monoResign').onclick = () => {
    if (over) return;
    const p = players[curPlayer];
    if (p.bankrupt) return;
    p.bankrupt = true; p.money = 0;
    log.push(`🏳️ ${p.name} 投降，破产淘汰`);
    checkWin();
    if (!over) nextTurn();
    render();
  };

  document.getElementById('monoSettle').onclick = () => {
    if (over) return;
    over = true;
    const alive = players.filter(p => !p.bankrupt);
    if (alive.length === 0) {
      winner = '平局';
      log.push('📊 结算：全员破产，平局');
    } else {
      let maxAssets = -1;
      alive.forEach(p => {
        const total = p.money + p.bank;
        if (total > maxAssets) maxAssets = total;
      });
      const winners = alive.filter(p => (p.money + p.bank) === maxAssets);
      if (winners.length === 1) {
        winner = winners[0].name + ' 获胜';
        log.push(`📊 结算：${winners[0].name} 获胜（总资产 $${maxAssets}）`);
      } else {
        winner = winners.map(p => p.name).join('、') + ' 并列获胜';
        log.push(`📊 结算：${winner}（总资产 $${maxAssets}）`);
      }
    }
    render();
  };

  document.getElementById('monoRestart').onclick = () => {
    initGame();
    render();
  };

  currentGameStateGetter = () => ({
    game: 'monopoly',
    totalPlayers, players, curPlayer, over, winner, log, round, turnCount, bankOpen, properties
  });
  currentGameStateSetter = (s) => {
    totalPlayers = s.totalPlayers;
    players = s.players;
    curPlayer = s.curPlayer;
    over = s.over;
    winner = s.winner;
    log = s.log || [];
    round = s.round;
    turnCount = s.turnCount;
    bankOpen = s.bankOpen;
    properties = s.properties;
    render();
  };

  initGame();
  buildSetup();
  render();
}

/* ---------- 保存/读取 ---------- */
document.getElementById('saveBtn').onclick = (e) => {
  e.stopPropagation();
  // 如果当前游戏不允许保存（例如国际象棋升变中）
  if (currentGameCanSave && !currentGameCanSave()) {
    alert('当前状态无法保存（如升变中），请先完成升变');
    saveDropdown.classList.remove('open');
    return;
  }
  saveDropdown.classList.toggle('open');
  loadDropdown.classList.remove('open');
};
document.getElementById('loadBtn').onclick = (e) => {
  e.stopPropagation();
  loadDropdown.classList.toggle('open');
  saveDropdown.classList.remove('open');
};
document.addEventListener('click', () => {
  saveDropdown.classList.remove('open');
  loadDropdown.classList.remove('open');
});

document.getElementById('saveLocal').onclick = () => {
  if (!currentGameStateGetter) { alert('当前没有正在进行的棋局'); return; }
  if (currentGameCanSave && !currentGameCanSave()) {
    alert('当前状态无法保存（如升变中），请先完成升变');
    saveDropdown.classList.remove('open');
    return;
  }
  const state = currentGameStateGetter();
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `棋局_${state.game}_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  saveDropdown.classList.remove('open');
};

document.getElementById('saveBrowser').onclick = () => {
  if (!currentGameStateGetter) { alert('当前没有正在进行的棋局'); return; }
  if (currentGameCanSave && !currentGameCanSave()) {
    alert('当前状态无法保存（如升变中），请先完成升变');
    saveDropdown.classList.remove('open');
    return;
  }
  const state = currentGameStateGetter();
  localStorage.setItem('qile_saved_game', JSON.stringify(state));
  alert('已保存到浏览器缓存');
  saveDropdown.classList.remove('open');
};

document.getElementById('loadLocal').onclick = () => {
  document.getElementById('fileInput').click();
  loadDropdown.classList.remove('open');
};

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const state = JSON.parse(ev.target.result);
      loadState(state);
    } catch (err) {
      alert('文件解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

document.getElementById('loadBrowser').onclick = () => {
  const raw = localStorage.getItem('qile_saved_game');
  if (!raw) { alert('浏览器中没有保存的棋局'); return; }
  try {
    const state = JSON.parse(raw);
    loadState(state);
  } catch (err) {
    alert('读取失败：' + err.message);
  }
  loadDropdown.classList.remove('open');
};

function loadState(state) {
  if (!state || !state.game) { alert('无效的棋局文件'); return; }
  const g = GAME_LIST.find(x => x.id === state.game);
  if (!g) { alert('未知的游戏类型：' + state.game); return; }
  if (currentGameId !== state.game) {
    location.hash = '/' + state.game;
  }
  setTimeout(() => {
    if (currentGameStateSetter) {
      currentGameStateSetter(state);
    } else {
      setTimeout(() => {
        if (currentGameStateSetter) currentGameStateSetter(state);
        else alert('无法恢复棋局，请重新进入该游戏后再试');
      }, 200);
    }
  }, 200);
}

/* ---------- 启动 ---------- */
renderEntries();
route();
</script>
</body>
</html>
