<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双陆棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f7f5f0;color:#3a3226;display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;color:#6b5636;font-weight:800}
.game-body{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sidebar{flex:0 0 280px;display:flex;flex-direction:column;gap:14px}
@media(max-width:800px){.sidebar{flex:1 1 100%}}
.panel{background:#fff;border:1px solid #ede3d0;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(150,130,90,.06)}
.panel h4{font-size:.8rem;color:#a89878;font-weight:700;margin-bottom:10px;letter-spacing:1.5px}
.rule-text{font-size:.82rem;line-height:1.7;color:#6b5636;max-height:200px;overflow-y:auto}
.status-text{font-size:1.1rem;font-weight:800;color:#8b6b3d;text-align:center;padding:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{flex:1 0 100px;background:#fff;border:1px solid #d9c8a9;color:#6b5636;padding:10px 8px;border-radius:12px;font-size:.8rem;cursor:pointer;font-weight:600}
.act:hover{background:#f0e6d2}
.btn{background:#fff;border:1px solid #d9c8a9;color:#6b5636;padding:8px 20px;border-radius:40px;cursor:pointer;font-size:.9rem;transition:.2s;box-shadow:0 2px 6px rgba(150,130,90,.1)}
.btn:hover{background:#f0e6d2}
.btn.primary{background:#8b6b3d;color:#fff;border-color:#8b6b3d}
.btn.primary:hover{background:#7a5c2e}
.board-wrap{flex:1 1 480px;display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid #ede3d0;border-radius:22px;padding:24px;box-shadow:0 6px 20px rgba(150,130,90,.08);overflow:auto}
.naval-log{max-height:140px;overflow-y:auto;font-size:.78rem;color:#6b5636;line-height:1.6}
.naval-log div{padding:2px 0;border-bottom:1px dashed #f0e6d2}
.backgammon-board{display:flex;background:#8b5a2b;border:8px solid #5a3a1a;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:8px;position:relative;gap:4px}
.backgammon-half{display:grid;grid-template-columns:repeat(6,58px);grid-template-rows:repeat(2,1fr);gap:2px;width:352px;height:340px}
@media(max-width:800px){.backgammon-half{grid-template-columns:repeat(6,42px);width:258px;height:250px}}
.backgammon-point{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;border:1px solid #5a3a1a;overflow:hidden}
.backgammon-point.bottom{justify-content:flex-end}
.backgammon-point.dark-tri{background:linear-gradient(180deg,#2a1a0a,#4a2a1a)}
.backgammon-point.light-tri{background:linear-gradient(180deg,#f0e6d2,#c8b898)}
.backgammon-point.dark-tri.bottom{background:linear-gradient(0deg,#2a1a0a,#4a2a1a)}
.backgammon-point.light-tri.bottom{background:linear-gradient(0deg,#f0e6d2,#c8b898)}
.backgammon-point.highlight{outline:3px solid #f1c40f;outline-offset:-3px;z-index:3}
.backgammon-point .checker{width:70%;height:24px;border-radius:50%;margin:1px 0;box-shadow:0 2px 4px rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;font-size:.7rem;font-weight:800;color:#fff}
.backgammon-point .checker.white{background:radial-gradient(circle at 32% 32%,#fff,#c0c0c0);color:#333}
.backgammon-point .checker.black{background:radial-gradient(circle at 32% 32%,#555,#000)}
.backgammon-bar{width:24px;background:#5a3a1a;border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:4px}
.backgammon-bar .checker{width:20px;height:20px;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.5);margin:1px 0}
.backgammon-bar .checker.white{background:radial-gradient(circle at 32% 32%,#fff,#c0c0c0)}
.backgammon-bar .checker.black{background:radial-gradient(circle at 32% 32%,#555,#000)}
.backgammon-dice{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.backgammon-die{width:48px;height:48px;background:#fff;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:1.8rem;font-weight:800;color:#3a3226;border:2px solid #d9c8a9;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.15)}
.backgammon-die.used{opacity:.35;text-decoration:line-through}
.backgammon-die:not(.used):hover{background:#fffbe8}
.backgammon-info{font-size:.85rem;color:#6b5636;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <h1>🎲 双陆棋 · 西洋双陆</h1>
  <div class="game-body">
    <div class="sidebar">
      <div class="panel"><h4>规则</h4><div class="rule-text">
        白先黑后。掷两枚骰子，按点数移动棋子。<br>
        白方从23往0方向移动，黑方从0往23方向移动。<br>
        目标：将全部15枚棋子移出棋盘。若点数被对方单子占住，则不能停在该点。
      </div></div>
      <div class="panel"><h4>状态</h4><div class="status-text" id="bgStatus">⚪ 白方掷骰</div></div>
      <div class="panel"><h4>棋盘信息</h4><div class="backgammon-info" id="bgInfo">白出: 0 / 黑出: 0</div></div>
      <div class="panel"><h4>日志</h4><div class="naval-log" id="bgLog"></div></div>
      <div class="panel"><h4>功能</h4><div class="actions">
        <button class="act" id="bgResign">🏳️ 投降</button>
        <button class="act" id="bgSettle">📊 结算</button>
        <button class="act" id="bgRestart">🔄 重开</button>
      </div></div>
    </div>
    <div class="board-wrap" id="bgWrap"></div>
  </div>
</div>
<script>
let points=Array.from({length:24},()=>[]);
points[23]=Array(5).fill('white');
points[18]=Array(3).fill('white');
points[12]=Array(5).fill('white');
points[1]=Array(2).fill('white');
points[0]=Array(5).fill('black');
points[5]=Array(3).fill('black');
points[16]=Array(5).fill('black');
points[11]=Array(2).fill('black');
let whiteOut=0,blackOut=0;
let cur='white',over=false,winner=null;
let dice=[],usedDice=[];
let phase='roll';
let selectedPoint=null;
let log=[];
const wrap=document.getElementById('bgWrap'),statusEl=document.getElementById('bgStatus'),infoEl=document.getElementById('bgInfo');

function render(){
  wrap.innerHTML='';
  const d=document.createElement('div');d.className='backgammon-board';
  const half1=document.createElement('div');half1.className='backgammon-half';
  const half2=document.createElement('div');half2.className='backgammon-half';
  function makePoint(idx,isBottom){
    const p=document.createElement('div');
    p.className='backgammon-point '+(idx%2===0?'dark-tri':'light-tri')+(isBottom?' bottom':'');
    p.dataset.idx=idx;
    if(selectedPoint===idx)p.classList.add('highlight');
    const arr=points[idx];
    const maxShow=5;
    arr.slice(0,maxShow).forEach(color=>{
      const c=document.createElement('div');c.className='checker '+color;
      c.textContent=color==='white'?'○':'●';
      p.appendChild(c);
    });
    if(arr.length>maxShow){
      const more=document.createElement('div');more.style.fontSize='.7rem';more.textContent='+'+(arr.length-maxShow);p.appendChild(more);
    }
    p.onclick=()=>clickPoint(idx);
    return p;
  }
  for(let i=0;i<6;i++)half1.appendChild(makePoint(12+i,false));
  for(let i=0;i<6;i++)half1.appendChild(makePoint(6+i,true));
  for(let i=0;i<6;i++)half2.appendChild(makePoint(18+i,false));
  for(let i=0;i<6;i++)half2.appendChild(makePoint(0+i,true));
  d.appendChild(half1);
  const bar=document.createElement('div');bar.className='backgammon-bar';
  for(let i=0;i<Math.min(3,whiteOut);i++){const c=document.createElement('div');c.className='checker white';bar.appendChild(c);}
  for(let i=0;i<Math.min(3,blackOut);i++){const c=document.createElement('div');c.className='checker black';bar.appendChild(c);}
  d.appendChild(bar);
  d.appendChild(half2);
  wrap.appendChild(d);
  const diceArea=document.createElement('div');diceArea.className='backgammon-dice';
  dice.forEach((v,i)=>{
    const die=document.createElement('div');die.className='backgammon-die'+(usedDice.includes(i)?' used':'');
    const symbols=['','⚀','⚁','⚂','⚃','⚄','⚅'];
    die.textContent=symbols[v];
    if(!usedDice.includes(i)&&phase==='move')die.onclick=()=>useDie(i);
    diceArea.appendChild(die);
  });
  wrap.appendChild(diceArea);
  if(phase==='roll'&&!over){
    const rollBtn=document.createElement('button');
    rollBtn.className='btn primary';
    rollBtn.textContent='🎲 掷骰子'; // 修复了这里，加了 🎲
    rollBtn.style.marginTop='12px';
    rollBtn.onclick=rollDice;
    wrap.appendChild(rollBtn);
  }
  statusEl.textContent=over?('🏆 '+(winner||'结束')):(cur==='white'?'⚪ 白方':'⚫ 黑方')+(phase==='roll'?' 掷骰':' 走棋');
  infoEl.textContent=`白出: ${whiteOut}/15 · 黑出: ${blackOut}/15`;
  document.getElementById('bgLog').innerHTML=log.slice(-15).map(l=>'<div>'+l+'</div>').join('');
}
function rollDice(){
  if(over||phase!=='roll')return;
  const d1=Math.floor(Math.random()*6)+1;
  const d2=Math.floor(Math.random()*6)+1;
  dice=[d1,d2];
  usedDice=[];
  phase='move';
  log.push(`🎲 ${cur==='white'?'⚪ 白方':'⚫ 黑方'} 掷出 ${d1}, ${d2}`);
  render();
}
function useDie(i){
  if(phase!=='move'||over)return;
  const steps=dice[i];
  if(selectedPoint!==null){
    if(!moveFrom(selectedPoint,steps)){
      selectedPoint=null;
      usedDice.push(i);
      render();
      return;
    }
    usedDice.push(i);
    selectedPoint=null;
    if(usedDice.length>=dice.length)nextTurn();
    render();
  }else{
    alert('请先点击要移动的棋子');
  }
}
function clickPoint(idx){
  if(over||phase!=='move')return;
  const arr=points[idx];
  if(selectedPoint===null){
    if(arr.length>0&&arr[0]===cur){
      selectedPoint=idx;
      render();
    }
  }else{
    const unusedIdx=dice.map((v,i)=>usedDice.includes(i)?-1:i).filter(i=>i>=0);
    if(unusedIdx.length===0){selectedPoint=null;render();return;}
    let moved=false;
    for(const ui of unusedIdx){
      const steps=dice[ui];
      if(moveFrom(selectedPoint,steps)){
        usedDice.push(ui);
        moved=true;
        break;
      }
    }
    if(moved){
      selectedPoint=null;
      if(usedDice.length>=dice.length)nextTurn();
    }else{
      if(arr.length>0&&arr[0]===cur)selectedPoint=idx;
      else selectedPoint=null;
    }
    render();
  }
}
function moveFrom(from,steps){
  const dir=cur==='white'?-1:1;
  const target=from+dir*steps;
  if(cur==='white'&&target<0){
    let allHome=true;
    for(let i=6;i<24;i++)if(points[i].some(c=>c==='white'))allHome=false;
    if(!allHome)return false;
    points[from].pop();
    whiteOut++;
    log.push(`⚪ 白方 ${from+1}→出棋`);
    if(whiteOut>=15){over=true;winner='白方获胜';log.push('🏆 '+winner);}
    return true;
  }
  if(cur==='black'&&target>23){
    let allHome=true;
    for(let i=0;i<18;i++)if(points[i].some(c=>c==='black'))allHome=false;
    if(!allHome)return false;
    points[from].pop();
    blackOut++;
    log.push(`⚫ 黑方 ${from+1}→出棋`);
    if(blackOut>=15){over=true;winner='黑方获胜';log.push('🏆 '+winner);}
    return true;
  }
  if(target<0||target>23)return false;
  const t=points[target];
  if(t.length>0&&t[0]!==cur){
    if(t.length>=2)return false;
    t.pop();
    log.push(`${cur==='white'?'⚪ 白方':'⚫ 黑方'} ${from+1}→${target+1} 吃子`);
  } else {
    log.push(`${cur==='white'?'⚪ 白方':'⚫ 黑方'} ${from+1}→${target+1}`);
  }
  points[from].pop();
  points[target].push(cur);
  return true;
}
function nextTurn(){
  cur=cur==='white'?'black':'white';
  dice=[];
  usedDice=[];
  phase='roll';
  selectedPoint=null;
}
document.getElementById('bgResign').onclick=()=>{if(over)return;over=true;winner=cur==='white'?'黑方胜(白投降)':'白方胜(黑投降)';log.push('🏳️ '+winner);render();};
document.getElementById('bgSettle').onclick=()=>{
  if(over)return;
  over=true;
  if(whiteOut>blackOut)winner=`白方获胜(白出${whiteOut} vs 黑出${blackOut})`;
  else if(blackOut>whiteOut)winner=`黑方获胜(白出${whiteOut} vs 黑出${blackOut})`;
  else winner=`平局(白出${whiteOut} 黑出${blackOut})`;
  log.push('📊 '+winner);render();
};
document.getElementById('bgRestart').onclick=()=>{
  points=Array.from({length:24},()=>[]);
  points[23]=Array(5).fill('white');
  points[18]=Array(3).fill('white');
  points[12]=Array(5).fill('white');
  points[1]=Array(2).fill('white');
  points[0]=Array(5).fill('black');
  points[5]=Array(3).fill('black');
  points[16]=Array(5).fill('black');
  points[11]=Array(2).fill('black');
  whiteOut=0;blackOut=0;
  cur='white';over=false;winner=null;dice=[];usedDice=[];phase='roll';selectedPoint=null;log=[];
  render();
};
render();
</script>
</body>
</html>
