<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞行棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f7f5f0;color:#3a3226;display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;color:#6b5636;font-weight:800}
.game-body{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sidebar{flex:0 0 280px;display:flex;flex-direction:column;gap:14px}
@media(max-width:800px){.sidebar{flex:1 1 100%}}
.panel{background:#fff;border:1px solid #ede3d0;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(150,130,90,.06)}
.panel h4{font-size:.8rem;color:#a89878;font-weight:700;margin-bottom:10px;letter-spacing:1.5px}
.rule-text{font-size:.82rem;line-height:1.7;color:#6b5636;max-height:200px;overflow-y:auto}
.status-text{font-size:1.1rem;font-weight:800;color:#8b6b3d;text-align:center;padding:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{flex:1 0 100px;background:#fff;border:1px solid #d9c8a9;color:#6b5636;padding:10px 8px;border-radius:12px;font-size:.8rem;cursor:pointer;font-weight:600}
.act:hover{background:#f0e6d2}
.btn{background:#fff;border:1px solid #d9c8a9;color:#6b5636;padding:8px 20px;border-radius:40px;cursor:pointer;font-size:.9rem;transition:.2s;box-shadow:0 2px 6px rgba(150,130,90,.1)}
.btn:hover{background:#f0e6d2}
.btn.primary{background:#8b6b3d;color:#fff;border-color:#8b6b3d}
.btn.primary:hover{background:#7a5c2e}
.board-wrap{flex:1 1 480px;display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid #ede3d0;border-radius:22px;padding:24px;box-shadow:0 6px 20px rgba(150,130,90,.08);overflow:auto}
.naval-log{max-height:140px;overflow-y:auto;font-size:.78rem;color:#6b5636;line-height:1.6}
.naval-log div{padding:2px 0;border-bottom:1px dashed #f0e6d2}
.ludo-board{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%}
.ludo-canvas{position:relative;width:700px;height:700px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);border:2px solid #e8e0d0;overflow:hidden}
@media(max-width:820px){.ludo-canvas{width:520px;height:520px}}
@media(max-width:560px){.ludo-canvas{width:380px;height:380px}}
.ludo-hangar{position:absolute;border-radius:10px;z-index:4;padding:3%;box-sizing:border-box}
.ludo-hangar.red{background:#e63b2e}.ludo-hangar.blue{background:#2b8fd6}
.ludo-hangar.green{background:#2b9c4a}.ludo-hangar.yellow{background:#f5d233}
.ludo-hangar .slot{position:absolute;width:38%;height:38%;border-radius:50%;background:rgba(255,255,255,.85);display:flex;justify-content:center;align-items:center;cursor:pointer;transition:.15s;border:2px solid rgba(0,0,0,.1)}
.ludo-hangar .slot:hover{transform:scale(1.1);background:#fff}
.ludo-hangar .slot.s1{left:6%;top:6%}.ludo-hangar .slot.s2{right:6%;top:6%}
.ludo-hangar .slot.s3{left:6%;bottom:6%}.ludo-hangar .slot.s4{right:6%;bottom:6%}
.ludo-hangar .slot .piece{width:80%;height:80%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.ludo-hangar .slot.empty{background:rgba(255,255,255,.5)}
.ludo-cell{position:absolute;width:4.2%;height:4.2%;border-radius:4px;background:#ccc;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:3;border:1.5px solid rgba(0,0,0,.18);transition:.15s}
.ludo-cell:hover{transform:scale(1.15);z-index:10}
.ludo-cell.color-red{background:#e63b2e}.ludo-cell.color-blue{background:#2b8fd6}
.ludo-cell.color-green{background:#2b9c4a}.ludo-cell.color-yellow{background:#f5d233}
.ludo-cell .dot{width:55%;height:55%;border-radius:50%;background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.ludo-cell .piece{width:82%;height:82%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.5);position:absolute;z-index:5;transition:all .2s}
.ludo-cell .piece.multi{width:50%;height:50%}
.ludo-cell .piece.multi:nth-child(1){top:5%;left:5%;}
.ludo-cell .piece.multi:nth-child(2){top:5%;right:5%;}
.ludo-cell .piece.multi:nth-child(3){bottom:5%;left:5%;}
.ludo-cell .piece.multi:nth-child(4){bottom:5%;right:5%;}
.ludo-cell .multi-count{position:absolute;font-size:.7rem;color:#fff;font-weight:800;text-shadow:0 1px 2px #000;bottom:-14px;z-index:10;white-space:nowrap;background:rgba(0,0,0,.7);padding:2px 4px;border-radius:4px;pointer-events:none;opacity:0;transition:.2s}
.ludo-cell:hover .multi-count{opacity:1}
.ludo-cell .fly-mark{font-size:.8rem;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ludo-cell.start-cell{box-shadow:0 0 0 2px #333,0 0 0 4px #fff}
.ludo-cell.home-gate{box-shadow:0 0 0 3px #8b6b3d}
.ludo-arm{position:absolute;width:4.2%;height:4.2%;border-radius:4px;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:3;border:1.5px solid rgba(0,0,0,.15)}
.ludo-arm:hover{transform:scale(1.15);z-index:10}
.ludo-arm.color-red{background:#f7c0ba}.ludo-arm.color-blue{background:#bfd9f0}
.ludo-arm.color-green{background:#bfe0c5}.ludo-arm.color-yellow{background:#f5eeb8}
.ludo-arm .piece{width:82%;height:82%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.5);position:absolute;z-index:5}
.ludo-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:11%;height:11%;border-radius:50%;background:conic-gradient(#e63b2e 0 25%,#2b8fd6 0 50%,#2b9c4a 0 75%,#f5d233 0);border:3px solid #fff;display:flex;justify-content:center;align-items:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ludo-center::after{content:'🏁';font-size:1.4rem;background:#fff;width:44%;height:44%;border-radius:50%;display:flex;justify-content:center;align-items:center;position:absolute}
.ludo-center .piece{width:18%;height:18%;border-radius:50%;border:2px solid #fff;position:absolute;z-index:6}
.ludo-players{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ludo-player{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:#fff;border:2px solid #ede3d0;transition:.2s}
.ludo-player.active{border-color:#f1c40f;background:#fffbe8;box-shadow:0 6px 16px rgba(241,196,15,.25)}
.ludo-player.resigned{opacity:.5;background:#f5f5f5}
.ludo-player .avatar{width:38px;height:38px;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-weight:800;font-size:.9rem}
.ludo-player .pname{font-size:.82rem;font-weight:700;color:#6b5636}
.ludo-player .pstats{font-size:.68rem;color:#a89878}
.dice-area{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.dice{width:60px;height:60px;background:#fff;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:2.2rem;font-weight:800;color:#6b5636;box-shadow:0 6px 16px rgba(0,0,0,.15);border:2px solid #ede3d0}
.ludo-msg{font-size:.9rem;color:#b55;font-weight:700;min-height:22px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <h1>✈️ 飞行棋 · 田字十字棋盘</h1>
  <div class="game-body">
    <div class="sidebar">
      <div class="panel"><h4>人数</h4><div class="actions" id="ludoCount"></div></div>
      <div class="panel"><h4>规则</h4><div class="rule-text">掷出双数（2/4/6）可点击机库圆框出子。掷出6可再投一次。走到✈格加完步数后判断落点是否在飞行格，是则+4格。走完一圈到“家门口”拐进自己臂。到终点需点数刚好，超过要回退。同格踢回机库。悬停多子格显示归属。</div></div>
      <div class="panel"><h4>状态</h4><div class="status-text" id="ludoStatus">🔴 红方走棋</div></div>
      <div class="panel"><h4>日志</h4><div class="naval-log" id="ludoLog"></div></div>
      <div class="panel"><h4>功能</h4><div class="actions">
        <button class="act" id="ludoResign">🏳️ 投降</button>
        <button class="act" id="ludoSettle">📊 结算</button>
        <button class="act" id="ludoRestart">🔄 重开</button>
      </div></div>
    </div>
    <div class="board-wrap" id="ludoWrap"></div>
  </div>
</div>
<script>
const COLORS=['#e63b2e','#2b8fd6','#2b9c4a','#f5d233'];
const NAMES=['红','蓝','绿','黄'];
const CLS=['red','blue','green','yellow'];
const CELL=4.2;
const OUTER=[];
for(let i=0;i<12;i++)OUTER.push({x:19+i*(62/12)+(62/12)/2,y:9});
for(let i=0;i<12;i++)OUTER.push({x:91,y:19+i*(62/12)+(62/12)/2});
for(let i=0;i<12;i++)OUTER.push({x:81-i*(62/12)-(62/12)/2,y:91});
for(let i=0;i<12;i++)OUTER.push({x:9,y:81-i*(62/12)-(62/12)/2});
const ARM_LEN=6;
const ARMS=[
  Array.from({length:ARM_LEN},(_,i)=>({x:18+i*(28/ARM_LEN)+(28/ARM_LEN)/2,y:50})),
  Array.from({length:ARM_LEN},(_,i)=>({x:50,y:18+i*(28/ARM_LEN)+(28/ARM_LEN)/2})),
  Array.from({length:ARM_LEN},(_,i)=>({x:82-i*(28/ARM_LEN)-(28/ARM_LEN)/2,y:50})),
  Array.from({length:ARM_LEN},(_,i)=>({x:50,y:82-i*(28/ARM_LEN)-(28/ARM_LEN)/2}))
];
const START_IDX=[0,12,24,36];
const HOME_GATE_IDX=[47,11,23,35];
const FLY_IDX=[];
for(let i=0;i<48;i+=4)FLY_IDX.push(i);
const HANGAR_POS=[
  {x:1,y:1,w:16,h:16},{x:83,y:1,w:16,h:16},
  {x:83,y:83,w:16,h:16},{x:1,y:83,w:16,h:16}
];
let count=4,pieces=[],resigned=[false,false,false,false];
let cur=0,over=false,winner=null,diceValue=0,phase='roll',msg='',extraRoll=false,log=[];
const wrap=document.getElementById('ludoWrap'),statusEl=document.getElementById('ludoStatus'),countBox=document.getElementById('ludoCount');

function activePlayers(){const all=count===3?[0,1,2]:(count===2?[0,1]:[0,1,2,3]);return all.filter(i=>!resigned[i]);}
function allPlayersInGame(){return count===3?[0,1,2]:(count===2?[0,1]:[0,1,2,3]);}
function checkAllResigned(){
  const active=activePlayers();
  if(active.length<=1){
    over=true;
    if(active.length===1)winner=NAMES[active[0]]+'方获胜(其他方投降)';
    else winner='全员投降';
    log.push('🏆 '+winner);
  }
}
function nextPlayer(){
  const active=activePlayers();
  if(active.length===0){over=true;winner='全员投降';return;}
  let idx=active.indexOf(cur);if(idx<0)idx=-1;idx=(idx+1)%active.length;cur=active[idx];
}
function initCur(){const active=activePlayers();if(!active.includes(cur))cur=active[0]||0;}
function buildCount(){
  countBox.innerHTML='';
  [2,3,4].forEach(n=>{
    const b=document.createElement('button');b.className='act';b.textContent=n+'人';b.style.flex='0 0 52px';
    if(n===count)b.style.background='#e8dcc0';
    b.onclick=()=>{count=n;resetGame();buildCount();render();};
    countBox.appendChild(b);
  });
}
function resetGame(){
  pieces=Array.from({length:count},()=>[-1,-1,-1,-1]);
  resigned=[false,false,false,false];
  cur=0;over=false;winner=null;diceValue=0;phase='roll';msg='';extraRoll=false;log=[];
}
function renderLog(){document.getElementById('ludoLog').innerHTML=log.slice(-15).map(l=>'<div>'+l+'</div>').join('');}
function render(){
  initCur();
  const d=document.createElement('div');d.className='ludo-board';
  const canvas=document.createElement('div');canvas.className='ludo-canvas';
  OUTER.forEach((pos,i)=>{
    const cell=document.createElement('div');cell.className='ludo-cell color-'+CLS[Math.floor(i/12)%4];
    const dot=document.createElement('div');dot.className='dot';cell.appendChild(dot);
    if(FLY_IDX.includes(i))cell.innerHTML='<span class="fly-mark">✈</span>';
    if(START_IDX.includes(i))cell.classList.add('start-cell');
    if(HOME_GATE_IDX.includes(i))cell.classList.add('home-gate');
    cell.style.left=(pos.x-CELL/2)+'%';cell.style.top=(pos.y-CELL/2)+'%';
    const cellPieces=[];
    pieces.forEach((pl,pIdx)=>{if(pIdx>=count)return;pl.forEach(p=>{if(p===i)cellPieces.push(pIdx);});});
    if(cellPieces.length===1){
      const piece=document.createElement('div');piece.className='piece';piece.style.background=COLORS[cellPieces[0]];cell.appendChild(piece);
    }else if(cellPieces.length>1){
      cellPieces.forEach(pIdx=>{
        const piece=document.createElement('div');piece.className='piece multi';piece.style.background=COLORS[pIdx];cell.appendChild(piece);
      });
      const counts={};cellPieces.forEach(pIdx=>counts[NAMES[pIdx]]=(counts[NAMES[pIdx]]||0)+1);
      const hoverText=Object.entries(counts).map(([n,c])=>`${n}方×${c}`).join(' ');
      const tip=document.createElement('div');tip.className='multi-count';tip.textContent=hoverText;cell.appendChild(tip);
    }
    cell.onclick=()=>clickOuter(i);canvas.appendChild(cell);
  });
  const allP=allPlayersInGame();
  ARMS.forEach((arm,pi)=>{
    if(!allP.includes(pi))return;
    arm.forEach((pos,i)=>{
      const m=document.createElement('div');m.className='ludo-arm color-'+CLS[pi];
      m.style.left=(pos.x-CELL/2)+'%';m.style.top=(pos.y-CELL/2)+'%';
      pieces[pi].forEach(p=>{
        if(p===100+i){const piece=document.createElement('div');piece.className='piece';piece.style.background=COLORS[pi];m.appendChild(piece);}
      });
      m.onclick=()=>clickArm(pi,i);canvas.appendChild(m);
    });
  });
  HANGAR_POS.forEach((hp,pi)=>{
    if(!allP.includes(pi))return;
    const hg=document.createElement('div');hg.className='ludo-hangar '+CLS[pi];
    hg.style.left=hp.x+'%';hg.style.top=hp.y+'%';hg.style.width=hp.w+'%';hg.style.height=hp.h+'%';
    if(resigned[pi])hg.style.opacity='0.35';
    ['s1','s2','s3','s4'].forEach((sp,si)=>{
      const slot=document.createElement('div');slot.className='slot '+sp;
      if(pieces[pi][si]===-1){
        const p=document.createElement('div');p.className='piece';p.style.background='#fff';p.style.border='2px solid rgba(0,0,0,.15)';slot.appendChild(p);
      }else{slot.classList.add('empty');}
      slot.onclick=(e)=>{e.stopPropagation();if(!resigned[pi])spawn(pi,si);};
      hg.appendChild(slot);
    });
    canvas.appendChild(hg);
  });
  const center=document.createElement('div');center.className='ludo-center';
  pieces.forEach((pl,pi)=>{
    if(pi>=count)return;
    pl.forEach((p,idx)=>{
      if(p===106){
        const piece=document.createElement('div');piece.className='piece';piece.style.background=COLORS[pi];
        const ang=idx*90+pi*15;
        piece.style.left=(50+Math.cos(ang*Math.PI/180)*26)+'%';
        piece.style.top=(50+Math.sin(ang*Math.PI/180)*26)+'%';
        piece.style.transform='translate(-50%,-50%)';
        center.appendChild(piece);
      }
    });
  });
  canvas.appendChild(center);
  d.appendChild(canvas);
  const info=document.createElement('div');info.className='ludo-players';
  allP.forEach(i=>{
    const p=document.createElement('div');p.className='ludo-player';
    if(i===cur&&!over&&!resigned[i])p.classList.add('active');
    if(resigned[i])p.classList.add('resigned');
    const outCount=pieces[i].filter(x=>x>=0&&x<48).length;
    const armCount=pieces[i].filter(x=>x>=100&&x<106).length;
    const homeCount=pieces[i].filter(x=>x===106).length;
    const statusText=resigned[i]?'已认输':`场上${outCount} 臂${armCount} 终点${homeCount}`;
    p.innerHTML=`<div class="avatar" style="background:${COLORS[i]}">${NAMES[i]}</div><div><div class="pname">${NAMES[i]}方</div><div class="pstats">${statusText}</div></div>`;
    info.appendChild(p);
  });
  d.appendChild(info);
  const diceArea=document.createElement('div');diceArea.className='dice-area';
  const dice=document.createElement('div');dice.className='dice';dice.textContent=diceValue||'🎲';diceArea.appendChild(dice);
  if(phase==='roll'&&!over){
    const rollBtn=document.createElement('button');rollBtn.className='btn primary';rollBtn.textContent='🎲 掷骰子';
    rollBtn.onclick=rollDice;diceArea.appendChild(rollBtn);
  }else if(phase==='select'&&!over){
    const skipBtn=document.createElement('button');skipBtn.className='btn';skipBtn.textContent='跳过';
    skipBtn.onclick=()=>{phase='roll';diceValue=0;extraRoll=false;log.push(`${NAMES[cur]}方 跳过`);nextPlayer();msg='跳过';render();};
    diceArea.appendChild(skipBtn);
  }
  d.appendChild(diceArea);
  const msgEl=document.createElement('div');msgEl.className='ludo-msg';msgEl.textContent=msg;d.appendChild(msgEl);
  wrap.innerHTML='';wrap.appendChild(d);
  statusEl.textContent=over?('🏆 '+(winner||'结束')):(NAMES[cur]+'方走棋'+(extraRoll?' (额外回合)':''));
  renderLog();
}
function rollDice(){
  if(phase!=='roll'||over||resigned[cur])return;
  diceValue=Math.floor(Math.random()*6)+1;phase='select';extraRoll=(diceValue===6);
  msg=`掷出 ${diceValue} 点${extraRoll?' — 可再投一次!':''}`;
  log.push(`🎲 ${NAMES[cur]}方 掷出 ${diceValue}`+(extraRoll?' (再投)':''));
  render();
}
function spawn(pi,si){
  if(phase!=='select'||pi!==cur)return;
  if(resigned[pi])return;
  if(diceValue%2!==0)return;
  if(pieces[pi][si]!==-1)return;
  pieces[pi][si]=START_IDX[pi];msg='出子到起点';log.push(`${NAMES[pi]}方 出子到起点`);phase='roll';
  if(extraRoll){extraRoll=false;diceValue=0;}else{diceValue=0;nextPlayer();}
  render();
}
function clickOuter(idx){
  if(phase!=='select'||over)return;
  for(let i=0;i<pieces[cur].length;i++){if(pieces[cur][i]===idx){movePiece(cur,i);return;}}
}
function clickArm(pi,idx){
  if(phase!=='select'||over||pi!==cur)return;
  for(let i=0;i<pieces[cur].length;i++){if(pieces[cur][i]===100+idx){movePiece(cur,i);return;}}
}
function movePiece(pi,pieceIdx){
  if(phase!=='select'||pi!==cur||resigned[pi])return;
  const pos=pieces[pi][pieceIdx];if(pos<0)return;
  let finalPos=pos,flew=false;const start=START_IDX[pi];
  if(pos>=0&&pos<48){
    const relative=(pos-start+48)%48;const newRelative=relative+diceValue;
    if(newRelative<=47){
      finalPos=(start+newRelative)%48;
      if(FLY_IDX.includes(finalPos)){finalPos=(finalPos+4)%48;msg='✈️ 飞行+4格!';flew=true;}
    }else{
      const armIdx=newRelative-48;
      if(armIdx>=ARM_LEN){
        if(armIdx===ARM_LEN)finalPos=106;
        else{const over=armIdx-ARM_LEN;finalPos=100+(ARM_LEN-1-(over-1));if(finalPos<100)finalPos=100;}
      }else{finalPos=100+armIdx;}
    }
  }else if(pos>=100&&pos<100+ARM_LEN){
    const armIdx=pos-100;const newArmIdx=armIdx+diceValue;
    if(newArmIdx>=ARM_LEN){
      if(newArmIdx===ARM_LEN){finalPos=106;}
      else{const over=newArmIdx-ARM_LEN;finalPos=100+(ARM_LEN-1-(over-1));if(finalPos<100)finalPos=100;}
    }else{finalPos=100+newArmIdx;}
  }else if(pos===106){return;}
  let text=`${NAMES[pi]}方 棋子${pieceIdx+1} (${pos+1})→(${finalPos+1})`+(flew?' ✈️飞行':'');
  const kicked=[];
  if(finalPos>=0&&finalPos<48){
    pieces.forEach((pl,pIdx)=>{
      if(pIdx===pi||pIdx>=count)return;
      pl.forEach((p,idx)=>{if(p===finalPos){pl[idx]=-1;kicked.push(NAMES[pIdx]);}});
    });
  }
  if(kicked.length)text+=` 踢回 ${kicked.join('、')}方`;
  if(finalPos===106)text+=' 🏁到达终点';
  log.push(text);
  pieces[pi][pieceIdx]=finalPos;
  if(pieces[pi].every(p=>p===106)){over=true;winner=NAMES[pi]+'方获胜';log.push('🏆 '+winner);render();return;}
  phase='roll';
  if(extraRoll){extraRoll=false;diceValue=0;}else{diceValue=0;nextPlayer();}
  render();
}
document.getElementById('ludoResign').onclick=()=>{
  if(over||resigned[cur])return;
  resigned[cur]=true;log.push(`🏳️ ${NAMES[cur]}方 认输`);msg=`${NAMES[cur]}方已认输`;
  checkAllResigned();
  if(!over){
    const active=activePlayers();
    if(active.length===0){over=true;winner='全员投降';log.push('🏆 全员投降');render();return;}
    let idx=active.indexOf(cur);if(idx<0)idx=0;else idx=(idx+1)%active.length;
    cur=active[idx];phase='roll';diceValue=0;extraRoll=false;
  }
  render();
};
document.getElementById('ludoSettle').onclick=()=>{
  if(over)return;
  const allP=allPlayersInGame();const scores={};
  allP.forEach(i=>{scores[i]=pieces[i].filter(x=>x===106).length;});
  const maxScore=Math.max(...allP.map(i=>scores[i]));
  const winners=allP.filter(i=>scores[i]===maxScore);
  over=true;
  if(winners.length===allP.length)winner='平局 (所有玩家到终点数相同)';
  else winner=winners.map(i=>NAMES[i]).join('、')+'方获胜';
  log.push('📊 '+winner);render();
};
document.getElementById('ludoRestart').onclick=()=>{resetGame();buildCount();render();};
resetGame();buildCount();render();
</script>
